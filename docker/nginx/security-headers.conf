# add_header is not inherited into a location that sets its own, so every location
# includes this file.
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Camera (QR attendance) and geolocation (bus tracking) are first-party features.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(self)" always;
