<nav class="bar" [attr.aria-label]="'shell.quickNav' | translate" data-testid="bottom-nav">
  @for (item of items(); track item.id) {
    <a
      class="dest"
      matRipple
      [routerLink]="item.link"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [attr.data-testid]="'bottom-' + item.id"
    >
      <span class="indicator">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      </span>
      <span class="label">{{ item.labelKey | translate }}</span>
    </a>
  }
  <button
    class="dest"
    matRipple
    type="button"
    data-testid="bottom-more"
    aria-controls="app-sidenav"
    [attr.aria-expanded]="moreExpanded()"
    (click)="more.emit()"
  >
    <span class="indicator"><mat-icon aria-hidden="true">menu</mat-icon></span>
    <span class="label">{{ 'shell.more' | translate }}</span>
  </button>
</nav>
